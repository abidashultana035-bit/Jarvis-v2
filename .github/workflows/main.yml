name: Build JARVIS v3 Iron

on: 
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sir
        uses: actions/checkout@v4

      - name: Setup Java 17 Sir
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Sir
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: Make Gradlew Executable Sir
        run: chmod +x gradlew || echo "No gradlew Sir"

      - name: Build APK Sir - All Commands
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload JARVIS APK Sir
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v3-Iron-Call-APK-Sir
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
